<!doctype html><html lang="ru"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/><title>Health Tracker</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:var(--tg-theme-text-color,#1c2930);background:var(--tg-theme-bg-color,#f5f7f8)}*{box-sizing:border-box}body{margin:0 auto;max-width:740px;padding:16px 14px 92px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:23px;letter-spacing:-.6px;margin:5px 0}h2{font-size:18px;margin:18px 0 10px}.muted,small{color:var(--tg-theme-hint-color,#75818a)}.card{background:var(--tg-theme-secondary-bg-color,#fff);border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 1px 6px #00000006}.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.tile{background:var(--tg-theme-secondary-bg-color,#fff);border-radius:17px;padding:14px}.tile b{display:block;font-size:22px;margin:7px 0}.tile span{font-size:13px}.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--tg-theme-bg-color,#fff);display:flex;justify-content:center;border-top:1px solid #9993;padding:8px 2px max(8px,env(safe-area-inset-bottom));z-index:2}.tabs button{flex:1;max-width:145px;font-size:11px;padding:7px 2px;border:0;background:none;color:inherit}.tabs button.active{color:#278873;font-weight:700}button{cursor:pointer}button.primary{border:0;background:#23836d;color:white;border-radius:12px;padding:12px 16px;font-weight:650}button.danger{border:0;background:none;color:#c44;padding:5px 10px}input,select{width:100%;padding:12px;border:1px solid #9aa6a633;border-radius:10px;background:var(--tg-theme-bg-color,#fff);color:inherit;font:inherit;margin:5px 0 11px}label{font-size:13px;font-weight:600}.line{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid #9992;padding:9px 0;align-items:center}.line:last-child{border:0}.pill{padding:5px 8px;border-radius:9px;background:#23836d16;color:#278873;font-size:12px}.hidden{display:none}canvas{width:100%;height:205px}.error{color:#c44}.chip{border:1px solid #9994;border-radius:9px;background:none;color:inherit;padding:8px;margin:3px}.btnrow{display:flex;gap:8px;flex-wrap:wrap}p{line-height:1.4}
</style></head><body><header><div><small>МОЙ ДНЕВНИК</small><h1>🩺 Health Tracker</h1></div><span class="pill">Mini App</span></header><p id="status" class="muted">Подключаемся…</p><main id="view"></main><nav class="tabs" id="tabs"><button data-page="today" class="active">🏠<br/>Сегодня</button><button data-page="health">❤️<br/>Здоровье</button><button data-page="food">🥗<br/>Питание</button><button data-page="activity">🏃<br/>Активность</button><button data-page="reminders">🔔<br/>Напоминания</button></nav><script>
const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();const init=tg?.initData||'';let me={},products=[],page='today',metric='weight',period=30;
const esc=s=>String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
const fmt=n=>Number(n||0).toLocaleString('ru-RU',{maximumFractionDigits:1});
const dt=s=>new Date(s).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
async function api(path,method='GET',body){const r=await fetch('/api/'+path,{method,headers:{'X-Telegram-Init-Data':init,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});const data=await r.json();if(!r.ok)throw Error(typeof data.detail==='string'?data.detail:'Ошибка запроса');return data}
function status(s,bad=false){const el=document.querySelector('#status');el.textContent=s;el.className=bad?'error':'muted'}
async function refresh(){me=await api('me');render()}
const last=(type)=>[...(me.metrics||[])].filter(x=>x.kind===type).sort((a,b)=>b.at.localeCompare(a.at))[0];
const kcal=()=> (me.foods||[]).filter(x=>new Date(x.at).toDateString()===new Date().toDateString()).reduce((s,x)=>s+x.calories,0);
const box=(title,content)=>`<section class="card"><h2>${title}</h2>${content}</section>`;
function render(){document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));let html='';if(page==='today'){
const w=last('weight'),pr=last('pressure'),p=last('pulse');html=`<div class="tiles"><div class="tile"><span>❤️ Давление</span><b>${pr?fmt(pr.v1)+'/'+fmt(pr.v2):'—'}</b><small>${pr?dt(pr.at):'Нет записей'}</small></div><div class="tile"><span>⚖️ Вес</span><b>${w?fmt(w.v1)+' кг':'—'}</b><small>${w?dt(w.at):'Нет записей'}</small></div><div class="tile"><span>🥗 Питание сегодня</span><b>${fmt(kcal())} ккал</b><small>По внесённым продуктам</small></div><div class="tile"><span>💓 Пульс</span><b>${p?fmt(p.v1):'—'}</b><small>уд/мин</small></div></div>`+box('Быстро добавить',`<div class="btnrow"><button class="chip" onclick="go('health')">❤️ Показатель</button><button class="chip" onclick="go('food')">🥗 Продукт</button><button class="chip" onclick="go('activity')">🏃 Тренировку</button></div>`)+box('История',history([...me.metrics,...me.foods,...me.workouts].sort((a,b)=>b.at.localeCompare(a.at)).slice(0,12)));
}else if(page==='health'){
html=box('Добавить показатель',`<form id="metricform"><label>Тип</label><select name="kind"><option value="pressure">Давление</option><option value="weight">Вес, кг</option><option value="pulse">Пульс</option></select><label>Значение (для давления: 120 / 80)</label><input name="value" placeholder="120 / 80" required/><label>Дата и время (можно оставить пустым)</label><input type="datetime-local" name="at"/><button class="primary">Сохранить</button></form>`)+box('График динамики',`<div class="btnrow"><button class="chip" onclick="graph('weight')">Вес</button><button class="chip" onclick="graph('pressure')">Давление</button><button class="chip" onclick="graph('pulse')">Пульс</button></div><canvas id="chart" width="620" height="220"></canvas>`)+box('Измерения',history((me.metrics||[]).sort((a,b)=>b.at.localeCompare(a.at)).slice(0,40),'metrics'));
}else if(page==='food'){
html=box('Добавить продукт',`<form id="foodform"><label>Поиск в справочнике</label><input id="search" placeholder="Например, гречка" autocomplete="off"/><select id="product" name="product_id"><option value="">Ручной ввод</option>${products.map(p=>`<option value="${esc(p.id)}">${esc(p.name)}</option>`).join('')}</select><div id="manual" class="hidden"><label>Название</label><input name="title" placeholder="Ваш продукт"/><div class="tiles">${['calories','protein','fat','carbs'].map((k,i)=>`<label>${['Ккал','Белки','Жиры','Углеводы'][i]} / 100 г<input type="number" min="0" max="1000" step="any" name="${k}"/></label>`).join('')}</div></div><label>Дата и время (необязательно)</label><input type="datetime-local" name="at"/><label>Масса порции, г</label><input type="number" name="grams" min="1" max="10000" step="any" value="100" required/><p class="muted" id="nutrition">Выберите продукт — значения ориентировочные.</p><button class="primary">Записать в дневник</button></form>`)+box('История питания',history((me.foods||[]).sort((a,b)=>b.at.localeCompare(a.at)).slice(0,40),'foods'));
}else if(page==='activity'){
html=box('Добавить тренировку',`<form id="workoutform"><label>Тип активности</label><input name="title" placeholder="Ходьба, пилатес, силовая…" required/><label>Длительность, минуты</label><input type="number" name="minutes" min="1" max="1440" required/><label>Дата и время (необязательно)</label><input type="datetime-local" name="at"/><label>Сожжённые ккал (необязательно, оценка)</label><input name="calories" type="number" min="0" max="10000" step="any"/><button class="primary">Сохранить</button></form>`)+box('История тренировок',history((me.workouts||[]).sort((a,b)=>b.at.localeCompare(a.at)).slice(0,40),'workouts'));
}else{
html=box('Ежедневное напоминание',`<form id="reminderform"><label>Текст</label><input name="title" placeholder="Принять назначенное лекарство" required/><label>Время</label><input type="time" name="local_time" required/><button class="primary">Добавить</button></form><small>Часовой пояс: ${esc(me.timezone||'не указан')}. Изменить: команда /timezone в боте.</small>`)+box('Расписание',history((me.reminders||[]).filter(x=>x.active),'reminders'));
}document.querySelector('#view').innerHTML=html;wire();if(page==='health')graph(metric)}
function history(items,group){if(!items.length)return '<p class="muted">Записей пока нет.</p>';return items.map(x=>{let text=x.kind==='pressure'?`${x.v1}/${x.v2} мм рт. ст.`:x.kind==='weight'?`${x.v1} кг`:x.kind==='pulse'?`${x.v1} уд/мин`:x.kind?`${esc(x.kind)}: ${x.v1}`:x.grams?`${esc(x.title)} · ${fmt(x.grams)} г · ${fmt(x.calories)} ккал`:x.minutes?`${esc(x.title)} · ${x.minutes} мин`:esc(x.title)+' · '+x.local_time;const grp=group||('kind'in x?'metrics':'grams'in x?'foods':'minutes'in x?'workouts':'reminders');return `<div class="line"><div><div>${text}</div><small>${x.local_time?'Ежедневно':dt(x.at)}</small></div><button class="danger" aria-label="Удалить" onclick="del('${grp}',${x.id})">✕</button></div>`}).join('')}
async function del(group,id){if(!confirm('Удалить запись?'))return;try{await api('entry/'+group+'/'+id,'DELETE');await refresh()}catch(e){alert(e.message)}}
function go(p){page=p;render()}
function wire(){const mf=document.querySelector('#metricform');if(mf)mf.onsubmit=async e=>{e.preventDefault();const f=new FormData(mf),kind=f.get('kind'),v=String(f.get('value')).replace(',','.').split(/[\/\s]+/).filter(Boolean).map(Number);if(!v.length||v.some(n=>!Number.isFinite(n))){alert('Неверное значение');return}const data={kind,v1:v[0],v2:v[1],at:f.get('at')?new Date(f.get('at')).toISOString():null};await submit('entry',data)};
const ff=document.querySelector('#foodform');if(ff){const update=()=>{const p=products.find(x=>x.id===document.querySelector('#product').value);document.querySelector('#manual').classList.toggle('hidden',!!p);const g=Number(ff.elements.grams.value)||0;document.querySelector('#nutrition').textContent=p?`${fmt(p.calories*g/100)} ккал · Б ${fmt(p.protein*g/100)} · Ж ${fmt(p.fat*g/100)} · У ${fmt(p.carbs*g/100)} (ориентировочно)`:'Введите данные с упаковки на 100 г'};ff.querySelector('#search').oninput=e=>{const value=e.target.value.toLowerCase().trim();document.querySelector('#product').innerHTML='<option value="">Ручной ввод</option>'+products.filter(p=>p.name.toLowerCase().includes(value)).map(p=>`<option value="${esc(p.id)}">${esc(p.name)}</option>`).join('');update()};ff.querySelector('#product').onchange=update;ff.elements.grams.oninput=update;update();ff.onsubmit=async e=>{e.preventDefault();const f=new FormData(ff);const data={kind:'food',product_id:f.get('product_id')||undefined,title:f.get('title'),grams:Number(f.get('grams')),at:f.get('at')?new Date(f.get('at')).toISOString():null};for(let k of ['calories','protein','fat','carbs'])data[k]=f.get(k)!==''?Number(f.get(k)):null;await submit('entry',data)}}
const wf=document.querySelector('#workoutform');if(wf)wf.onsubmit=async e=>{e.preventDefault();const f=new FormData(wf);await submit('entry',{kind:'workout',title:f.get('title'),minutes:Number(f.get('minutes')),at:f.get('at')?new Date(f.get('at')).toISOString():null,calories:f.get('calories')?Number(f.get('calories')):null})};const rf=document.querySelector('#reminderform');if(rf)rf.onsubmit=async e=>{e.preventDefault();const f=new FormData(rf);await submit('reminder',{title:f.get('title'),local_time:f.get('local_time')})}}
async function submit(endpoint,data){try{await api(endpoint,'POST',data);status('✅ Сохранено');await refresh()}catch(e){status(e.message,true);alert(e.message)}}
function graph(kind){metric=kind;const c=document.querySelector('#chart');if(!c)return;const ctx=c.getContext('2d'),rows=(me.metrics||[]).filter(x=>x.kind===kind).sort((a,b)=>a.at.localeCompare(b.at)).slice(-40);ctx.clearRect(0,0,c.width,c.height);ctx.font='15px system-ui';if(rows.length<2){ctx.fillStyle='#7d8990';ctx.fillText('Нужно минимум 2 измерения',25,90);return}const all=rows.flatMap(r=>kind==='pressure'?[r.v1,r.v2]:[r.v1]);let low=Math.min(...all),high=Math.max(...all);if(low===high){low-=1;high+=1}const draw=(key,color)=>{ctx.beginPath();ctx.strokeStyle=color;ctx.lineWidth=3;rows.forEach((r,i)=>{const x=35+i*(c.width-65)/(rows.length-1),y=15+(high-r[key])*(c.height-47)/(high-low);i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke()};draw('v1','#23836d');if(kind==='pressure')draw('v2','#cf9a38');ctx.fillStyle='#77868f';ctx.fillText(fmt(high),0,14);ctx.fillText(fmt(low),0,c.height-18);ctx.fillText(dt(rows[0].at),40,c.height-5);ctx.fillText(dt(rows[rows.length-1].at),c.width-115,c.height-5)}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>go(b.dataset.page));if(!init){status('Mini App необходимо открыть через кнопку Telegram-бота. В браузере без Telegram данные недоступны.',true)}else Promise.all([api('me'),api('products')]).then(([u,p])=>{me=u;products=p;status('Данные синхронизированы');render()}).catch(e=>status(e.message,true));
</script></body></html>
